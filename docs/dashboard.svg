<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="960" height="640" fill="#0f1320"/>
  <text x="24" y="40" fill="#eef1f7" font-size="22" font-weight="700">Close Accelerator — Exception Dashboard</text>
  <text x="24" y="62" fill="#9aa4bd" font-size="12">Period June 2026 · 9 entities · 220 journal entries · 48 reconciliations · generated in ~2 seconds</text>
  <rect x="24" y="74" rx="12" width="430" height="22" fill="#2a1a22" stroke="#ff6b6b" stroke-opacity="0.4"/>
  <text x="36" y="89" fill="#ff6b6b" font-size="11" font-weight="600">⚠ Automated draft — every item requires preparer sign-off before close</text>

  <!-- KPI tiles -->
  <g>
    <rect x="24"  y="112" rx="10" width="216" height="70" fill="#181d2e" stroke="#2a3350"/>
    <text x="40" y="146" fill="#ff6b6b" font-size="26" font-weight="800">10</text>
    <text x="40" y="166" fill="#9aa4bd" font-size="11">Total exceptions</text>
    <rect x="256" y="112" rx="10" width="216" height="70" fill="#181d2e" stroke="#2a3350"/>
    <text x="272" y="146" fill="#eef1f7" font-size="26" font-weight="800">9</text>
    <text x="272" y="166" fill="#9aa4bd" font-size="11">High severity</text>
    <rect x="488" y="112" rx="10" width="216" height="70" fill="#181d2e" stroke="#2a3350"/>
    <text x="504" y="146" fill="#eef1f7" font-size="26" font-weight="800">$312K</text>
    <text x="504" y="166" fill="#9aa4bd" font-size="11">Intercompany out of balance</text>
    <rect x="720" y="112" rx="10" width="216" height="70" fill="#181d2e" stroke="#2a3350"/>
    <text x="736" y="146" fill="#eef1f7" font-size="26" font-weight="800">$486K</text>
    <text x="736" y="166" fill="#9aa4bd" font-size="11">Flagged JE exposure</text>
  </g>

  <!-- Exception rows -->
  <text x="24" y="216" fill="#9aa4bd" font-size="12" font-weight="700" letter-spacing="1">JOURNAL-ENTRY &amp; FRAUD-RISK FLAGS</text>
  <g>
    <rect x="24" y="228" rx="10" width="912" height="52" fill="#181d2e" stroke="#2a3350"/>
    <rect x="38" y="244" rx="5" width="42" height="18" fill="#ff6b6b"/><text x="45" y="257" fill="#0f1320" font-size="10" font-weight="800">HIGH</text>
    <text x="94" y="250" fill="#eef1f7" font-size="13" font-weight="700">Possible duplicate payment · <tspan fill="#7c9cff">Riverside Dialysis LLC</tspan></text>
    <text x="94" y="268" fill="#9aa4bd" font-size="11.5">Two identical $48,750 charges to McKesson Medical (INV-88421) posted 6/11 and 6/13 by j.torres.</text>
    <text x="920" y="258" fill="#eef1f7" font-size="14" font-weight="700" text-anchor="end">$48,750</text>

    <rect x="24" y="288" rx="10" width="912" height="52" fill="#181d2e" stroke="#2a3350"/>
    <rect x="38" y="304" rx="5" width="42" height="18" fill="#ff6b6b"/><text x="45" y="317" fill="#0f1320" font-size="10" font-weight="800">HIGH</text>
    <text x="94" y="310" fill="#eef1f7" font-size="13" font-weight="700">Round-dollar top-side accrual · <tspan fill="#7c9cff">ARC Corporate</tspan></text>
    <text x="94" y="328" fill="#9aa4bd" font-size="11.5">$250,000 manual accrual, no vendor, posted 2:47am Sunday 6/28 by d.oconnell — classic override profile.</text>
    <text x="920" y="318" fill="#eef1f7" font-size="14" font-weight="700" text-anchor="end">$250,000</text>

    <rect x="24" y="348" rx="10" width="912" height="52" fill="#181d2e" stroke="#2a3350"/>
    <rect x="38" y="364" rx="5" width="42" height="18" fill="#ff6b6b"/><text x="45" y="377" fill="#0f1320" font-size="10" font-weight="800">HIGH</text>
    <text x="94" y="370" fill="#eef1f7" font-size="13" font-weight="700">Aged unreconciled AR · <tspan fill="#7c9cff">Prairie Dialysis Partners LLC</tspan></text>
    <text x="94" y="388" fill="#9aa4bd" font-size="11.5">Patient A/R rec ties only via a $188,900 reconciling item aged &gt;90 days. GL $1.24M vs subledger $1.05M.</text>
    <text x="920" y="378" fill="#eef1f7" font-size="14" font-weight="700" text-anchor="end">$188,900</text>

    <rect x="24" y="408" rx="10" width="912" height="52" fill="#181d2e" stroke="#2a3350"/>
    <rect x="38" y="424" rx="5" width="42" height="18" fill="#ff6b6b"/><text x="45" y="437" fill="#0f1320" font-size="10" font-weight="800">HIGH</text>
    <text x="94" y="430" fill="#eef1f7" font-size="13" font-weight="700">Intercompany out of balance · <tspan fill="#7c9cff">Consolidation</tspan></text>
    <text x="94" y="448" fill="#9aa4bd" font-size="11.5">Due From Affiliates ($2.22M) ≠ Due To Affiliates ($2.53M). $312,400 will not eliminate — fix before consolidating.</text>
    <text x="920" y="438" fill="#eef1f7" font-size="14" font-weight="700" text-anchor="end">$312,400</text>
  </g>

  <!-- Benford -->
  <text x="24" y="496" fill="#9aa4bd" font-size="12" font-weight="700" letter-spacing="1">BENFORD'S LAW SCREEN</text>
  <rect x="24" y="508" rx="10" width="912" height="112" fill="#181d2e" stroke="#2a3350"/>
  <text x="40" y="530" fill="#ff6b6b" font-size="12" font-weight="700">Flag: vendor Grainger — 10 of 14 invoices (71%) lead with digit 9 vs ~4.6% expected. Possible split invoicing.</text>
  <!-- bars: actual (blue/red) with expected dash (amber) ; base y=606, max height 60 for 0.32 -->
  <g>
    <rect x="60"  y="553.5" width="40" height="52.5" fill="#7c9cff" rx="2"/><line x1="52"  x2="108" y1="549.6" y2="549.6" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="80"  y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">1</text>
    <rect x="156" y="576"   width="40" height="30"   fill="#7c9cff" rx="2"/><line x1="148" x2="204" y1="573"   y2="573"   stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="176" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">2</text>
    <rect x="252" y="583.5" width="40" height="22.5" fill="#7c9cff" rx="2"/><line x1="244" x2="300" y1="582.6" y2="582.6" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="272" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">3</text>
    <rect x="348" y="587.3" width="40" height="18.7" fill="#7c9cff" rx="2"/><line x1="340" x2="396" y1="587.8" y2="587.8" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="368" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">4</text>
    <rect x="444" y="591"   width="40" height="15"   fill="#7c9cff" rx="2"/><line x1="436" x2="492" y1="591.2" y2="591.2" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="464" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">5</text>
    <rect x="540" y="594.8" width="40" height="11.2" fill="#7c9cff" rx="2"/><line x1="532" x2="588" y1="593.4" y2="593.4" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="560" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">6</text>
    <rect x="636" y="596.6" width="40" height="9.4"  fill="#7c9cff" rx="2"/><line x1="628" x2="684" y1="595.1" y2="595.1" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="656" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">7</text>
    <rect x="732" y="598.5" width="40" height="7.5"  fill="#7c9cff" rx="2"/><line x1="724" x2="780" y1="596.4" y2="596.4" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="752" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">8</text>
    <rect x="828" y="585.4" width="40" height="20.6" fill="#ff6b6b" rx="2"/><line x1="820" x2="876" y1="597.4" y2="597.4" stroke="#f4b740" stroke-width="2" stroke-dasharray="5,4"/><text x="848" y="618" fill="#9aa4bd" font-size="10" text-anchor="middle">9</text>
  </g>
  <text x="480" y="636" fill="#6b7280" font-size="10" text-anchor="middle">Blue = actual leading-digit share · amber dash = Benford expected · digit 9 spikes well above expectation</text>
</svg>
